<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill the Boxes!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fill Boxes">
<meta name="theme-color" content="#2b1a6b">
<link rel="apple-touch-icon" id="touchIcon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23ED1C24'/%3E%3C/svg%3E">
<link rel="icon" id="favIcon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23ED1C24'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E9%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Fill the Boxes","short_name":"Fill Boxes","display":"standalone","orientation":"any","background_color":"#2b1a6b","theme_color":"#2b1a6b","start_url":"."}'>
<style>
:root{
  --red:#e8262b; --yellow:#f6c700; --green:#2ea44f; --blue:#1f6fe0; --wild:#222;
  --p1:#1f8ff0; --p2:#ff4fa3;
  --bg1:#2b1a6b; --bg2:#5b2aa8;
  --font:"Baloo 2","Comic Sans MS","Chalkboard SE","Marker Felt","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:#fff;
  background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 70%);}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
.screen{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}

/* ---------- setup ---------- */
#setup{align-items:center;justify-content:center;overflow:auto}
.card-panel{background:#fff;color:#2b1a6b;border-radius:28px;padding:24px;width:min(92vw,460px);box-shadow:0 12px 40px #0006;text-align:center;margin:12px}
.card-panel h1{margin:0 0 4px;font-size:clamp(28px,7vw,40px);line-height:1.05}
.card-panel p{margin:0 0 14px;font-size:18px;opacity:.75}
.field{display:block;text-align:left;font-weight:800;font-size:18px;margin:10px 0}
.field input{display:block;width:100%;margin-top:4px;font-size:26px;font-weight:800;padding:10px 14px;border-radius:16px;border:4px solid var(--p1);color:#2b1a6b;outline:none}
.field.f2 input{border-color:var(--p2)}
.big-btn{display:block;width:100%;min-height:68px;margin-top:14px;font-size:30px;font-weight:900;color:#fff;border-radius:22px;
  background:linear-gradient(#ffb300,#ff6f00);box-shadow:0 6px 0 #b34700;transition:transform .08s}
.big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b34700}
.big-btn.green{background:linear-gradient(#45d36a,#1f9c46);box-shadow:0 6px 0 #146a2f}
.big-btn.green:active{box-shadow:0 1px 0 #146a2f}
.big-btn.ghost{background:#e9e4f8;color:#2b1a6b;box-shadow:0 6px 0 #b9b0dc;font-size:22px;min-height:56px}
.small-link{margin-top:12px;background:none;color:#8a7bc0;font-size:16px;font-weight:700;text-decoration:underline;min-height:44px}
.tally-line{margin-top:6px;font-weight:800;font-size:18px}

/* ---------- game ---------- */
#game{flex-direction:column}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:64px}
#banner{flex:1;text-align:center;font-size:clamp(20px,5.2vw,32px);font-weight:900;padding:8px 12px;border-radius:999px;color:#fff;
  box-shadow:0 4px 0 #0004;transition:background .3s;line-height:1.1}
#banner.t0{background:var(--p1)} #banner.t1{background:var(--p2)} #banner.tn{background:#7a5bd0}
.round-btn{width:52px;height:52px;border-radius:50%;background:#ffffff26;color:#fff;font-size:26px;flex:none}
.round-btn:active{background:#ffffff55}
#arena{flex:1;min-height:0;display:grid;gap:6px;padding:0 8px 8px;
  grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;grid-template-areas:"b0" "mid" "b1"}
#board0{grid-area:b0} #board1{grid-area:b1} #mid{grid-area:mid}
@media (orientation:landscape){
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}
  #arena{grid-template-columns:1fr minmax(240px,32vw) 1fr;grid-template-rows:1fr;grid-template-areas:"b0 mid b1"}
}
.board{border-radius:24px;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;
  background:#ffffff1c;border:4px solid transparent;transition:all .25s;opacity:.72}
.board.p0{--pc:var(--p1)} .board.p1{--pc:var(--p2)}
.board.active{opacity:1;border-color:var(--pc);background:#ffffff33;box-shadow:0 0 0 4px #ffffff55,0 0 28px var(--pc);transform:scale(1.0)}
.bhead{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;font-weight:900;font-size:clamp(17px,4.4vw,26px)}
.bname{background:var(--pc);border-radius:999px;padding:1px 14px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcount{font-size:clamp(15px,4vw,22px);white-space:nowrap}
.bwins{font-size:.7em;opacity:.9}
.grid{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(4px,1.2vmin,10px);padding-top:4px;justify-items:center;align-items:center}
.box{position:relative;height:100%;max-height:100%;aspect-ratio:5/7;max-width:100%;border-radius:12%/9%;
  background:#ffffff2e;border:3px dashed #ffffff66;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(22px,6vh,52px);color:#ffffff88;overflow:hidden}
.box.full{border:3px solid #fff;color:#fff;background:var(--cc);text-shadow:0 2px 0 #0004;box-shadow:0 3px 0 #0005}
.box.full::before{content:"";position:absolute;width:82%;height:62%;background:#fff;border-radius:50%;transform:rotate(-24deg);opacity:.92}
.box.full span{position:relative;color:var(--cc);text-shadow:none;z-index:1}
.box.full::after{content:"★";position:absolute;top:0;right:5%;font-size:.42em;color:#fff}
.box.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.box.hit{animation:shake .5s}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* ---------- middle ---------- */
#mid{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,22px);min-height:0;padding:2px 0}
@media (orientation:landscape){#mid{flex-direction:column;justify-content:space-around}}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot label{font-size:16px;font-weight:800;opacity:.85}
.ucard{--cc:var(--red);position:relative;width:var(--w);aspect-ratio:5/7;border-radius:14%/10%;border:5px solid #fff;background:var(--cc);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 6px 0 #0006,0 10px 20px #0005}
.ucard.red{--cc:var(--red)}.ucard.yellow{--cc:var(--yellow)}.ucard.green{--cc:var(--green)}.ucard.blue{--cc:var(--blue)}
.ucard.wild{background:conic-gradient(var(--red) 0 25%,var(--blue) 0 50%,var(--green) 0 75%,var(--yellow) 0)}
.ucard .oval{position:absolute;width:84%;height:64%;background:#fff;border-radius:50%;transform:rotate(-24deg)}
.ucard.wild .oval{background:#222}
.ucard .val{position:relative;font-size:calc(var(--w)*.5);color:var(--cc);line-height:1;text-align:center}
.ucard.wild .val{color:#fff}
.ucard .val.txt{font-size:calc(var(--w)*.22);padding:0 4px}
.ucard .corner{position:absolute;top:3%;left:8%;font-size:calc(var(--w)*.2);text-shadow:0 2px 0 #0004}
#deckBtn{--w:clamp(96px,min(26vw,20vh),170px);background:none;padding:0;border-radius:14%/10%;position:relative}
#deckBtn .ucard{background:#1b1b1b;--cc:#1b1b1b}
#deckBtn .ucard .oval{background:var(--red);transform:rotate(-24deg)}
#deckBtn .ucard .val{color:#ffde00;font-size:calc(var(--w)*.25);text-shadow:0 3px 0 #0008}
#deckBtn.ready{animation:bob 1.1s ease-in-out infinite}
#deckBtn:active .ucard{transform:translateY(4px)}
#deckBtn.locked{filter:grayscale(.6) brightness(.75);animation:none}
#deckBtn::before,#deckBtn::after{content:"";position:absolute;inset:0;border-radius:14%/10%;background:#333;border:5px solid #fff;z-index:-1}
#deckBtn::before{transform:translate(5px,5px)}#deckBtn::after{transform:translate(10px,10px)}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
#deckCount{font-size:15px;font-weight:800;opacity:.85}
#lastWrap{--w:clamp(80px,min(21vw,16vh),140px);perspective:700px}
#last{transform-style:preserve-3d;position:relative;width:var(--w);aspect-ratio:5/7}
#last .ucard{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#last .front{transform:rotateY(0)}
#last .back{transform:rotateY(180deg);background:#1b1b1b}
#last .empty{position:absolute;inset:0;border-radius:14%/10%;border:4px dashed #ffffff66;display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.6}
#last.flip{animation:flip .7s ease-out}
@keyframes flip{0%{transform:rotateY(180deg) translateY(-30px) scale(.8)}60%{transform:rotateY(-12deg) translateY(-8px) scale(1.08)}100%{transform:rotateY(0)}}
#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;
  max-width:92vw;background:#fff;color:#2b1a6b;font-weight:900;font-size:clamp(18px,4.8vw,28px);text-align:center;
  padding:10px 20px;border-radius:24px;box-shadow:0 6px 0 #0004,0 10px 24px #0005;pointer-events:none;opacity:0;transition:opacity .2s}
#msg.show{opacity:1}
#msg.good{background:#c9f7d4}#msg.bad{background:#ffd9d9}#msg.meh{background:#fff3c0}

/* ---------- drag & drop ---------- */
#lastWrap,#lastWrap *{-webkit-touch-callout:none}
#lastWrap.ready{cursor:grab;touch-action:none}
#lastWrap.ready .ucard{touch-action:none;animation:none}
#lastWrap.ready #last .front{box-shadow:0 0 0 4px #ffe066,0 6px 0 #0006,0 10px 24px #0007}
#lastWrap.ready.hint #last .front{animation:wiggle .9s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-5deg)}75%{transform:translateY(-8px) rotate(5deg)}}
.ghost{position:fixed!important;left:0;top:0;z-index:60;pointer-events:none;touch-action:none;margin:0;transform-origin:center;will-change:transform;
  box-shadow:0 18px 30px #0008!important}
.ghost.fly{transition:transform .25s cubic-bezier(.3,1.3,.5,1),opacity .25s}
.shake-card{animation:shake .5s}
.box.want{border-style:solid;border-color:#ffe066;animation:want 1s ease-in-out infinite}
@keyframes want{0%,100%{box-shadow:0 0 0 0 #ffe06600}50%{box-shadow:0 0 0 6px #ffe066aa}}
.box.over{transform:scale(1.2);border-style:solid;border-color:#ffe066;background:#ffe06677;box-shadow:0 0 22px 4px #ffe066;z-index:3}
#bin{visibility:hidden;width:clamp(64px,17vw,104px);aspect-ratio:1;border-radius:22px;border:4px dashed #ffffffaa;background:#ffffff22;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(12px,3.2vw,16px);font-weight:900;line-height:1.1;text-align:center;transition:transform .15s}
#bin .ico{font-size:clamp(28px,8vw,44px)}
#bin.on{visibility:visible;animation:bob 1.1s ease-in-out infinite}
#bin.over{background:#ffe066;color:#2b1a6b;border-color:#fff;border-style:solid;transform:scale(1.18);animation:none}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:#1b0f4acc;text-align:center}
.overlay.on{display:flex}
#firstName{font-size:clamp(40px,12vw,84px);font-weight:900;margin:8px 0;text-shadow:0 5px 0 #0005}
#firstTxt{font-size:clamp(20px,5vw,30px);font-weight:800}
#win{z-index:30;background:#2b1a6bee}
#win .card-panel{position:relative;z-index:2}
#winTitle{font-size:clamp(34px,9vw,54px);margin:6px 0}
#trophy{font-size:90px;animation:bob 1s ease-in-out infinite;display:inline-block}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#confettiOn{display:none}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="screen on">
  <div class="card-panel">
    <h1>🃏 Fill the Boxes! 🃏</h1>
    <p>Draw cards. Fill all 10 boxes (0-9) first to win!</p>
    <label class="field">Player 1<input id="n0" maxlength="14" autocomplete="off" placeholder="Player 1"></label>
    <label class="field f2">Player 2<input id="n1" maxlength="14" autocomplete="off" placeholder="Player 2"></label>
    <button class="big-btn green" id="startBtn">▶ Let's Play!</button>
    <div class="tally-line" id="setupTally"></div>
    <button class="small-link" id="resetTally">Reset win counts</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="topbar">
    <button class="round-btn" id="menuBtn" aria-label="Names / new game">⚙️</button>
    <div id="banner" class="tn">Ready?</div>
    <button class="round-btn" id="muteBtn" aria-label="Sound on/off">🔊</button>
  </div>
  <div id="arena">
    <section class="board p0" id="board0"></section>
    <div id="mid">
      <div class="slot">
        <button id="deckBtn" aria-label="Draw a card"><div class="ucard"><div class="oval"></div><div class="val txt">TAP<br>ME!</div></div></button>
        <div id="deckCount"></div>
      </div>
      <div class="slot">
        <div id="lastWrap"><div id="last"><div class="empty">?</div></div></div>
        <label>Last card</label>
      </div>
      <div class="slot"><div id="bin"><span class="ico">🗑️</span>Turn over</div></div>
    </div>
    <section class="board p1" id="board1"></section>
  </div>
  <div id="msg"></div>
</div>

<!-- WHO GOES FIRST -->
<div class="overlay" id="first">
  <div>
    <div id="firstTxt">🎲 Who goes first? 🎲</div>
    <div id="firstName">?</div>
  </div>
</div>

<!-- WIN -->
<div class="overlay" id="win">
  <canvas id="confetti"></canvas>
  <div class="card-panel">
    <div id="trophy">🏆</div>
    <h1 id="winTitle">You win!</h1>
    <p id="winSub"></p>
    <div class="tally-line" id="winTally"></div>
    <button class="big-btn green" id="againBtn">🔁 Play Again</button>
    <button class="big-btn ghost" id="namesBtn">✏️ Change names</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   EASY-TO-CHANGE SETTINGS
   ===================================================================== */
// What happens when you draw a SPECIAL card (Skip, Reverse, Draw Two, Wild, Wild Draw Four)?
//   'end-turn'   -> friendly message, your turn is over, the other player goes   (default)
//   'draw-again' -> friendly message, no penalty, you draw again
// (The number 0 is a normal box: it fills the 0 box, and a second 0 ends your turn.)
const SPECIAL_CARD_RULE = 'end-turn';

// Timings in milliseconds (tests may shorten these through window.UNO.config)
const CONFIG = { hintTime: 4000, tapThreshold: 8, drawLock: 900, passDelay: 1900, firstPickTime: 1800, firstRevealTime: 1200, msgTime: 1800 };

/* =====================================================================
   DECK  (real 108-card Uno deck)
   card = { c: 'red'|'yellow'|'green'|'blue'|'wild', v: '0'..'9' | 'skip'|'reverse'|'draw2'|'wild'|'wild4' }
   ===================================================================== */
const COLORS = ['red','yellow','green','blue'];
function buildDeck(){
  const d = [];
  for (const c of COLORS){
    d.push({c, v:'0'});                                   // one 0 per colour  -> 4
    for (let n=1;n<=9;n++){ d.push({c,v:String(n)}); d.push({c,v:String(n)}); } // two of 1-9 -> 72
    for (const s of ['skip','reverse','draw2']){ d.push({c,v:s}); d.push({c,v:s}); } // -> 24
  }
  for (let i=0;i<4;i++){ d.push({c:'wild',v:'wild'}); d.push({c:'wild',v:'wild4'}); } // -> 8
  return d;                                               // 108
}
function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const SPECIAL_LABEL = { skip:'Skip', reverse:'Reverse', draw2:'Draw Two', wild:'Wild', wild4:'Wild Draw Four' };
const SPECIAL_FACE  = { skip:'🚫', reverse:'⇄', draw2:'+2', wild:'★', wild4:'+4' };
const BOX_COUNT = 10;                                   // boxes 0-9
const isNumberBox = card => /^[0-9]$/.test(card.v);   // 0-9 fill a box

/* =====================================================================
   STATE + STORAGE
   ===================================================================== */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  names: store.get('unofill.names', ['','']),
  tally: store.get('unofill.tally', {}),      // { lowercaseName: wins }
  muted: store.get('unofill.muted', false),
  draw: [], discard: [],
  boards: [ {}, {} ],                          // {'5': 'red', ...}
  turn: 0, busy: true, over: false, last: null, pending: null, dragUsed: false, hint: false, reshuffles: 0, timers: []
};
const nm = i => S.names[i];
const key = i => nm(i).trim().toLowerCase();
const wins = i => S.tally[key(i)] || 0;

function later(fn, ms){ const t = setTimeout(fn, ms); S.timers.push(t); return t; }
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers = []; }

/* ---------- deck handling ---------- */
function takeCard(){
  if (S.draw.length === 0){
    if (S.discard.length === 0){ S.draw = shuffle(buildDeck()); }         // safety net
    else { S.draw = shuffle(S.discard); S.discard = []; }
    S.reshuffles++;
    flashMsg('🔀 Shuffling the deck!', 'meh');
  }
  return S.draw.pop();
}

/* =====================================================================
   SOUND (WebAudio, no files)
   ===================================================================== */
let actx = null;
function audio(){
  if (!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type='sine', vol=0.25){
  if (S.muted) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const sfx = {
  draw(){ tone(500,0,.08,'triangle'); tone(700,.06,.08,'triangle'); },
  good(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.18,'square',.15)); },
  bad(){ tone(220,0,.18,'sawtooth',.18); tone(160,.16,.3,'sawtooth',.18); },
  special(){ tone(400,0,.1,'sine'); tone(800,.08,.12,'sine'); tone(1200,.16,.16,'sine'); },
  turn(){ tone(660,0,.1,'triangle'); tone(880,.1,.14,'triangle'); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.25,'square',.16)); }
};

/* =====================================================================
   RENDERING
   ===================================================================== */
function cardHTML(card, cls=''){
  const num = /^\d$/.test(card.v);
  const face = num ? card.v : SPECIAL_FACE[card.v];
  const small = num ? '' : ' txt';
  const label = num ? card.v : (card.v==='wild4' ? '+4' : card.v==='draw2' ? '+2' : SPECIAL_FACE[card.v]);
  return `<div class="ucard ${card.c} ${cls}"><div class="oval"></div>
    <div class="corner">${label}</div>
    <div class="val${num?'':' '}" style="${num?'':'font-size:calc(var(--w)*.34)'}">${face}</div></div>`;
}
function setBanner(txt, cls){ const b=$('banner'); b.textContent = txt; b.className = cls; }

function renderBoards(popIdx=null, popBox=null, hitBox=null){
  for (let p=0;p<2;p++){
    const el = $('board'+p);
    const filled = Object.keys(S.boards[p]).length;
    el.className = 'board p'+p + (S.turn===p && !S.over ? ' active' : '');
    let html = `<div class="bhead"><span class="bname">${esc(nm(p))}</span><span class="bcount">${filled}/${BOX_COUNT} ⭐</span></div><div class="grid">`;
    for (let n=0;n<BOX_COUNT;n++){
      const col = S.boards[p][n];
      const cls = ['box'];
      if (col){ cls.push('full'); }
      if (S.pending && S.turn===p && isNumberBox(S.pending) && Number(S.pending.v)===n) cls.push('want');
      if (popIdx===p && popBox===n) cls.push('pop');
      if (popIdx===p && hitBox===n) cls.push('hit');
      const style = col ? `style="--cc:var(--${col==='wild'?'wild':col})"` : '';
      html += `<div class="${cls.join(' ')}" data-n="${n}" ${style}><span>${n}</span></div>`;
    }
    html += '</div>';
    el.innerHTML = html;
  }
  $('deckCount').textContent = `${S.draw.length} cards left`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTurn(){
  if (S.over) return;
  setBanner(`👉 ${nm(S.turn)}'s turn!`, 't'+S.turn);
  $('deckBtn').classList.toggle('ready', !S.busy);
  $('deckBtn').classList.toggle('locked', S.busy);
}

let msgTimer = null;
function flashMsg(text, kind='meh', ms=CONFIG.msgTime){
  const m = $('msg'); m.textContent = text; m.className = 'show ' + kind;
  clearTimeout(msgTimer); msgTimer = setTimeout(()=>{ m.className=''; }, ms);
}

function showLast(card){
  const l = $('last');
  l.classList.remove('flip'); void l.offsetWidth;
  l.innerHTML = cardHTML(card,'front') + '<div class="ucard back"><div class="oval" style="background:var(--red)"></div></div>';
  l.classList.add('flip');
}

/* =====================================================================
   GAME FLOW
   ===================================================================== */
function newGame(){
  clearTimers(); cancelPending();
  S.draw = shuffle(buildDeck()); S.discard = []; S.reshuffles = 0;
  S.boards = [{}, {}]; S.over = false; S.last = null; S.busy = true;
  $('last').innerHTML = '<div class="empty">?</div>';
  $('last').classList.remove('flip');
  $('win').classList.remove('on'); stopConfetti();
  showScreen('game');
  renderBoards(); setBanner('Ready?', 'tn');
  pickFirst();
}

function pickFirst(){
  const winner = Math.random() < .5 ? 0 : 1;
  const ov = $('first'); ov.classList.add('on');
  const box = $('firstName'); let i = 0;
  const iv = setInterval(()=>{ i^=1; box.textContent = nm(i); box.style.color = i? 'var(--p2)':'#7cc4ff'; sfx.draw(); }, 120);
  later(()=>{
    clearInterval(iv);
    box.textContent = nm(winner) + '!'; box.style.color = winner? 'var(--p2)':'#7cc4ff';
    sfx.good(); S.turn = winner;
    later(()=>{ ov.classList.remove('on'); startTurn(winner); }, CONFIG.firstRevealTime);
  }, CONFIG.firstPickTime);
}

function startTurn(p){
  S.turn = p; S.busy = false; renderBoards(); renderTurn(); sfx.turn();
}

function drawTapped(){
  audio();                                   // unlock sound on first tap
  if (S.busy || S.over) return;
  S.busy = true;
  const card = takeCard();
  S.discard.push(card); S.last = card;
  S.pending = card; S.dragUsed = false; S.hint = false;   // now the player must drag it!
  sfx.draw(); showLast(card);
  $('deckBtn').classList.remove('ready'); $('deckBtn').classList.add('locked');
  const special = !isNumberBox(card), p = S.turn;
  $('bin').classList.toggle('on', special);
  $('lastWrap').classList.add('ready'); $('lastWrap').classList.remove('hint');
  renderBoards();                            // highlights the matching box
  setBanner(special ? `✨ ${SPECIAL_LABEL[card.v]}! Drag it to the bin` : `👇 ${nm(p)}: drag it to box ${card.v}!`, 't'+p);
  S.timers.push(setTimeout(()=>{               // accessibility hint if drag not used
    if (S.pending !== card || S.dragUsed || D.active) return;
    S.hint = true; $('lastWrap').classList.add('hint');
    flashMsg(special ? '👆 Drag the card to the bin — or just tap it!' : `👆 Drag the card to box ${card.v} — or tap it and I'll place it!`, 'meh', 6000);
  }, CONFIG.hintTime));
}

/* =====================================================================
   DRAG & DROP  (Pointer Events: works for finger, pen and mouse)
   ===================================================================== */
const D = { active:false, ghost:null, id:null, sx:0, sy:0, ox:0, oy:0, moved:false, over:null, src:null, w:0 };

function cardSrc(){ return $('last').querySelector('.front'); }
function makeGhost(src){
  const r = src.getBoundingClientRect();
  const g = src.cloneNode(true);
  g.classList.add('ghost'); g.style.setProperty('--w', r.width+'px');
  g.style.width = r.width+'px'; g.style.animation = 'none';
  document.body.appendChild(g);
  D.ghost = g; D.w = r.width; D.src = src;
  placeGhost(r.left + r.width/2, r.top + r.height/2, 1);
  src.style.opacity = '.25';
  return r;
}
// (cx,cy) = desired centre of the ghost
function placeGhost(cx, cy, scale){
  const g = D.ghost, h = D.w*1.4;
  g.style.transform = `translate(${cx - D.w/2}px,${cy - h/2}px) scale(${scale})`;
}
function targetAt(x, y){
  if (!S.pending) return null;
  const el = document.elementFromPoint(x, y); if (!el) return null;
  if (!isNumberBox(S.pending)){ const b = el.closest('#bin'); return b ? {el:b, ok:true} : null; }
  const box = el.closest('#board'+S.turn+' .box');
  if (!box) return null;
  return {el:box, ok: Number(box.dataset.n) === Number(S.pending.v)};
}
function setOver(t){
  const el = t && t.ok ? t.el : null;
  if (D.over === el) return;
  if (D.over) D.over.classList.remove('over');
  D.over = el; if (el){ el.classList.add('over'); tone(880,0,.05,'sine',.1); }
}
function targetEl(){        // where the pending card belongs (for auto-place)
  if (!isNumberBox(S.pending)) return $('bin');
  return document.querySelector('#board'+S.turn+' .box[data-n="'+S.pending.v+'"]');
}
function endDragState(){
  if (D.ghost) D.ghost.remove();
  if (D.src) D.src.style.opacity = '';
  if (D.over) D.over.classList.remove('over');
  D.active = false; D.ghost = null; D.over = null; D.src = null; D.id = null; D.moved = false;
}
function snapBack(startRect){
  const g = D.ghost, src = D.src; if (!g){ endDragState(); return; }
  const r = src.getBoundingClientRect();
  g.classList.add('fly'); placeGhost(r.left + r.width/2, r.top + r.height/2, 1);
  if (D.over){ D.over.classList.remove('over'); D.over = null; }
  setTimeout(()=>{
    endDragState();
    const c = cardSrc(); if (c){ c.classList.remove('shake-card'); void c.offsetWidth; c.classList.add('shake-card'); }
    sfx.bad();
  }, 270);
  if (S.pending) flashMsg(isNumberBox(S.pending) ? `Not that one! Try box ${S.pending.v} 😊` : 'Drop it in the bin 🗑️', 'meh', 1600);
}
function flyToTarget(el){       // animate ghost into target, then commit the card
  const g = D.ghost, r = el.getBoundingClientRect();
  g.classList.add('fly'); placeGhost(r.left + r.width/2, r.top + r.height/2, Math.min(1, r.width / D.w));
  g.style.opacity = '.6';
  const card = S.pending;
  setTimeout(()=>{ endDragState(); commitCard(card); }, 260);
}
function commitCard(card){
  if (S.pending !== card) return;
  S.pending = null; S.hint = false;
  $('lastWrap').classList.remove('ready','hint'); $('bin').classList.remove('on');
  clearTimeout(msgTimer); $('msg').className = '';
  resolveCard(card);
}
function cancelPending(){
  endDragState(); document.querySelectorAll('.ghost').forEach(g=>g.remove());
  S.pending = null; S.hint = false;
  $('lastWrap').classList.remove('ready','hint'); $('bin').classList.remove('on','over');
}

const LW = $('lastWrap');
LW.addEventListener('contextmenu', e=>e.preventDefault());
LW.addEventListener('dragstart', e=>e.preventDefault());
LW.addEventListener('pointerdown', e=>{
  if (!S.pending || D.active || S.over) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  audio(); e.preventDefault();
  D.active = true; D.id = e.pointerId; D.sx = e.clientX; D.sy = e.clientY; D.moved = false;
  try{ LW.setPointerCapture(e.pointerId); }catch(_){}
  const src = cardSrc(); const r = src.getBoundingClientRect();
  D.ox = e.clientX - (r.left + r.width/2); D.oy = e.clientY - (r.top + r.height/2);
  D.src = src;
});
LW.addEventListener('pointermove', e=>{
  if (!D.active || e.pointerId !== D.id || D.snapping) return;
  if (!D.moved){
    if (Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < CONFIG.tapThreshold) return;
    D.moved = true; S.dragUsed = true; $('lastWrap').classList.remove('hint');
    makeGhost(D.src); sfx.draw();
  }
  e.preventDefault();
  placeGhost(e.clientX - D.ox, e.clientY - D.oy, 1.12);
  setOver(targetAt(e.clientX, e.clientY));
});
LW.addEventListener('pointerup', e=>{
  if (!D.active || e.pointerId !== D.id) return;
  try{ LW.releasePointerCapture(e.pointerId); }catch(_){}
  if (!D.moved){                                   // it was a tap
    const special = !isNumberBox(S.pending);
    D.active = false; D.id = null; D.src = null;
    if (special || S.hint) return autoPlace();
    const c = cardSrc(); c.classList.remove('shake-card'); void c.offsetWidth; c.classList.add('shake-card');
    flashMsg(`Drag me to box ${S.pending.v}! 👇`, 'meh', 1500);
    return;
  }
  const t = targetAt(e.clientX, e.clientY);
  if (t && t.ok) flyToTarget(t.el); else snapBack();
});
LW.addEventListener('pointercancel', e=>{
  if (!D.active || e.pointerId !== D.id) return;
  if (D.moved) snapBack(); else { D.active = false; D.id = null; D.src = null; }
});
function autoPlace(){       // tap-to-place fallback (and tap to end turn on special cards)
  if (!S.pending || D.active) return;
  const el = targetEl(); if (!el) return;
  D.active = true; makeGhost(cardSrc()); flyToTarget(el);
}

function resolveCard(card){
  const p = S.turn, other = 1 - p;
  
  if (isNumberBox(card)){
    const n = Number(card.v);
    if (!S.boards[p][n]){
      S.boards[p][n] = card.c;                       // NEW number -> fill & keep going
      renderBoards(p, n);
      const filled = Object.keys(S.boards[p]).length;
      if (filled === BOX_COUNT){ return later(()=>win(p), 700); }
      sfx.good();
      flashMsg(`⭐ New ${n}! Draw again!`, 'good');
      renderCount();
      return later(()=>{ S.busy=false; renderTurn(); }, CONFIG.drawLock);
    }
    // duplicate -> turn ends
    renderBoards(p, null, n);
    sfx.bad();
    flashMsg(`Oops, ${nm(p)} already has ${n}! ${nm(other)}'s turn.`, 'bad', CONFIG.passDelay);
    setBanner(`😬 Already have ${n}!`, 't'+p);
    return later(()=>startTurn(other), CONFIG.passDelay);
  }

  // special card (Skip, Reverse, Draw Two, Wild, Wild Draw Four): no box is filled
  const what = SPECIAL_LABEL[card.v];
  sfx.special();
  if (SPECIAL_CARD_RULE === 'end-turn'){
    flashMsg(`${what}! Special card! Turn over. ${nm(other)}'s turn.`, 'meh', CONFIG.passDelay);
    setBanner(`✨ Special card! Turn over`, 't'+p);
    return later(()=>startTurn(other), CONFIG.passDelay);
  }
  flashMsg(`${what}! No penalty. Draw again! 😊`, 'meh');
  renderCount();
  later(()=>{ S.busy=false; renderTurn(); }, CONFIG.drawLock);
}
function renderCount(){ $('deckCount').textContent = `${S.draw.length} cards left`; }

/* ---------- winning ---------- */
function win(p){
  S.over = true; S.busy = true;
  const k = key(p); S.tally[k] = (S.tally[k]||0) + 1; store.set('unofill.tally', S.tally);
  renderBoards(); setBanner(`🎉 ${nm(p)} wins! 🎉`, 't'+p);
  $('winTitle').textContent = `${nm(p)} wins!`;
  $('winSub').textContent = 'All 10 boxes filled! Great job! 🌟';
  $('winTally').innerHTML = tallyText();
  $('win').classList.add('on');
  sfx.win(); startConfetti();
}
function tallyText(){ return `🏆 ${esc(nm(0))}: ${wins(0)} &nbsp;•&nbsp; ${esc(nm(1))}: ${wins(1)}`; }

/* ---------- confetti ---------- */
let cf = { raf:0, parts:[] };
function startConfetti(){
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff3b3b','#ffd400','#2ecc71','#3aa0ff','#ff4fa3','#ffffff','#ff9f1a'];
  cf.parts = Array.from({length:180}, ()=>({
    x:Math.random()*cv.width, y:-Math.random()*cv.height, w:8+Math.random()*10, h:12+Math.random()*12,
    vy:2+Math.random()*4, vx:-2+Math.random()*4, r:Math.random()*6, vr:-.2+Math.random()*.4,
    c:cols[Math.floor(Math.random()*cols.length)] }));
  cancelAnimationFrame(cf.raf);
  const step = ()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const q of cf.parts){
      q.x+=q.vx; q.y+=q.vy; q.r+=q.vr;
      if (q.y>cv.height+20){ q.y=-20; q.x=Math.random()*cv.width; }
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.fillStyle=q.c; ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h); ctx.restore();
    }
    cf.raf = requestAnimationFrame(step);
  };
  step();
}
function stopConfetti(){ cancelAnimationFrame(cf.raf); const cv=$('confetti'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); }

/* =====================================================================
   SETUP / SCREENS / BUTTONS
   ===================================================================== */
function showScreen(id){ ['setup','game'].forEach(s=>$(s).classList.toggle('on', s===id)); }

function showSetup(){
  clearTimers(); cancelPending(); stopConfetti(); $('first').classList.remove('on'); $('win').classList.remove('on');
  $('n0').value = S.names[0]; $('n1').value = S.names[1];
  updateSetupTally(); showScreen('setup');
}
function updateSetupTally(){
  const a = ($('n0').value.trim()||'Player 1'), b = ($('n1').value.trim()||'Player 2');
  const ta = S.tally[a.toLowerCase()]||0, tb = S.tally[b.toLowerCase()]||0;
  $('setupTally').innerHTML = (ta||tb) ? `🏆 ${esc(a)}: ${ta} &nbsp;•&nbsp; ${esc(b)}: ${tb}` : '';
}
function startFromSetup(){
  let a = $('n0').value.trim() || 'Player 1';
  let b = $('n1').value.trim() || 'Player 2';
  if (a.toLowerCase() === b.toLowerCase()) b = b + ' 2';
  S.names = [a, b]; store.set('unofill.names', S.names);
  newGame();
}
function setMute(m){ S.muted = m; store.set('unofill.muted', m); $('muteBtn').textContent = m ? '🔇' : '🔊'; }

$('startBtn').onclick = ()=>{ audio(); startFromSetup(); };
$('n0').oninput = $('n1').oninput = updateSetupTally;
$('n0').onkeydown = e=>{ if(e.key==='Enter') $('n1').focus(); };
$('n1').onkeydown = e=>{ if(e.key==='Enter') $('startBtn').click(); };
$('resetTally').onclick = ()=>{ if (confirm('Reset all win counts?')){ S.tally = {}; store.set('unofill.tally', S.tally); updateSetupTally(); } };
$('deckBtn').onclick = drawTapped;
$('muteBtn').onclick = ()=>{ setMute(!S.muted); if(!S.muted){ audio(); sfx.good(); } };
$('menuBtn').onclick = ()=>{ if (S.over || confirm('Stop this game and go back to the names screen?')) showSetup(); };
$('againBtn').onclick = ()=>{ audio(); newGame(); };
$('namesBtn').onclick = showSetup;

/* ---------- home-screen icon drawn at runtime (iOS needs a PNG) ---------- */
(function makeIcon(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#e8262b'; x.fillRect(0,0,180,180);
    x.fillStyle = '#fff'; x.save(); x.translate(90,90); x.rotate(-0.42); x.beginPath(); x.ellipse(0,0,50,74,0,0,7); x.fill(); x.restore();
    x.fillStyle = '#f6c700'; x.font = 'bold 110px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.strokeStyle = '#2b1a6b'; x.lineWidth = 8; x.strokeText('9', 90, 96); x.fillText('9', 90, 96);
    const url = c.toDataURL('image/png');
    $('touchIcon').href = url; $('favIcon').href = url;
  }catch(e){}
})();

/* ---------- boot ---------- */
setMute(S.muted);
$('n0').value = S.names[0]; $('n1').value = S.names[1];
updateSetupTally();
window.addEventListener('resize', ()=>{ if ($('win').classList.contains('on')) startConfetti(); });

// Test / debug hooks (harmless for players)
window.UNO = { S, D, CONFIG, autoPlace, buildDeck, drawTapped, newGame, takeCard, get rule(){ return SPECIAL_CARD_RULE; }, BOX_COUNT };
</script>
</body>
